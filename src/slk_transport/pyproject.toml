[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slk-transport"
version = "4.5.5"
description = "Exact cross-agent transport for Small Loop Skill"
requires-python = ">=3.10"
dependencies = ["slk-overwatch-tools @ git+https://github.com/DWG7318/slk-overwatch-tools.git@c02cd22bb24c00f2232ba4638c5972d8711aacb5"]
license = {file = "LICENSE"}

[project.scripts]
slk-transport = "slk_transport.cli:main"

[tool.setuptools]
packages = ["slk_transport", "slk_transport.adapters"]
package-dir = {slk_transport = "."}
