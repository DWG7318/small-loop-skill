[package]
name = "slk-state-cli"
version = "4.5.3"
edition = "2021"
license = "MIT"
description = "State transaction command-line tool for Small Loop Skill"
repository = "https://github.com/DWG7318/slk-state"

[[bin]]
name = "slk-state"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
