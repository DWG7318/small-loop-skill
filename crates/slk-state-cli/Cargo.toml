[package]
name = "slk-state-cli"
version = "4.5.5"
edition = "2021"
license = "MIT"
description = "State transaction command-line tool for Small Loop Skill"
repository = "https://github.com/DWG7318/slk-state"

[[bin]]
name = "slk-state"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
slk-state-core = { git = "https://github.com/DWG7318/slk-state-core.git", rev = "d7d8cb6f4dedc3de26629824c8c50bcb3416a807" }

[dev-dependencies]
tempfile = "3"
time = { version = "0.3.54", features = ["formatting"] }
