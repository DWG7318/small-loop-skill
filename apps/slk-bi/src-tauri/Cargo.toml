[package]
name = "slk-bi-desktop"
version = "1.1.4"
edition = "2021"
license = "MIT"
description = "Read-only desktop BI for Small Loop Skill"
repository = "https://github.com/DWG7318/slk-bi"

[lib]
name = "slk_bi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0.151"
regex = "1"
sha2 = "0.10.9"
time = { version = "0.3.54", features = ["formatting"] }
tempfile = "3.27.0"
slk-state-core = { git = "https://github.com/DWG7318/slk-state-core.git", rev = "0aba753f5d328484e59ec1c5c13fa594fedc3d19" }
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
