name: validate

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml
      - run: python scripts/validate_repository.py
      - run: python scripts/validate_serial_plan.py examples/minimal-run/serial-plan.yaml
      - run: python -m pytest -q
