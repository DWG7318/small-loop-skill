interface:
  display_name: "Small Loop Skill (SLK)"
  short_description: "One strict serial Run with one Control and one Worker"
  default_prompt: "Use only $small-loop-skill (SLK). Keep exactly two visible conversations: one Control and one persistent Worker. For every formal Control decision declare exactly one responsibility mode: SUPERVISOR_RESPONSIBILITY, CHECKER_RESPONSIBILITY, or VERIFIER_RESPONSIBILITY. Worker owns D0 implementation evidence, Checker owns D1 CELL acceptance, and Verifier owns D2 GO and D3 Run verification from clean environments against immutable candidates. Execute one CELL at a time and release no successor until every current Required predecessor has D2 PASS. Bind every CELL dispatch to one durable dispatch ID and ordered ACK, optional PROGRESS, then one BLOCKED or FINAL signal. Treat BLOCKED_UNREAD and COMPLETED_UNREAD as duplicate-dispatch brakes; terminal signals wake Control and are ingested exactly once with atomic route, Run-status, visible-progress, and Owner-status synchronization. Redispatch only after proven non-delivery and only to the same persistent Worker. Recover thread or IPC loss as CONTROL_DISCONNECTED without creating another Worker. On D1 defect failure bind one DEFECT_LINEAGE to the failed immutable Candidate, fingerprint, reproduction evidence, and repair round. Before product repair require reproduction or evidenced non-reproduction, one active hypothesis, one minimal experiment, and confirmed root cause. Require fail-before/pass-after/regression evidence only for stably reproducible and reasonably automatable defects; otherwise require Checker-approved exemption evidence. Three Checker-rejected repair Candidates forbid a fourth ordinary rework and route architecture review, method-boundary exit, or versioned Contract revision. Add no D4, role, visible conversation, universal TDD mandate, Chain/Stage/Barrier, or graph activation. Blank receipts are PENDING and never imply success. Formal resolution cannot replace D2 for a Required GO; it changes the Required set only through a versioned Baseline Amendment. Consume the frozen LCCoding RUN_CONTRACT; do not redefine Calabash or claim centralized project security closure. Block D3 and Owner Acceptance for known Critical/High security risks. After D3 PASS, request bounded Run Owner Acceptance and output LOOP_OWNER_ACCEPTED only from an explicit Owner verdict."
