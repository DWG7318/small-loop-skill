interface:
  display_name: "Small Loop Skill (SLK)"
  short_description: "One strict serial Run: Control + Worker, with one non-authoritative Patrol"
  default_prompt: "Use only $small-loop-skill (SLK) for one bounded strict serial Run. Formal engineering topology is one Control plus one persistent Worker; each formal Control decision declares SUPERVISOR_RESPONSIBILITY, CHECKER_RESPONSIBILITY, or VERIFIER_RESPONSIBILITY. Add exactly one visible non-authoritative RUN_PATROL conversation and heartbeat using gpt-5.6-luna+xhigh. Preserve D0 Worker, D1 Checker, D2/D3 Verifier, immutable candidate, causal defect repair, security hard brakes, and explicit Owner Acceptance. Supervisor must not loop or use positive-timeout wait_threads; after control/dispatch end the turn. Worker alone may wake the frozen original Checker through the four bounded levels with a scoped GO/CELL n/N delivery/BLOCKED/EXECUTION_FAILURE message; matching WAKE_ACK stops escalation, and no ID guessing, replacement Checker, or real test sleep is allowed. Treat GO/CELL/Round/plan steps, subtask, 子任务, and visible stable peer tasks as non-subagents; reject spawn_agent, delegate_task, hidden Agent, or background Agent evidence. Worker reports delivery position only; Checker derives accepted CELL count only from current D1 PASS and reports Supervisor once at GO candidate boundary; Supervisor derives verified GO count only from current D2 PASS and reports only material GO/Run/D3/Owner changes. Required-set amendments recompute versioned denominators without adding acceptance. Before dispatch Supervisor freezes measurable DEVICE_CAPACITY_PROFILE, CUMULATIVE_ENGINEERING_LOAD, and total-cost CELL_CAPACITY_GATE; Checker reviews it and only PASS dispatches. Worker never self-splits; on excess scope stop/checkpoint and return CELL_SCOPE_EXCEEDED. Post-dispatch split is a planning defect and 3+ successors require CELL_OVERSIZE_SEVERE plus remaining-plan/device-budget review. Every method role, including Patrol, defaults to denied for set_thread_pinned(true); only proven Owner manual UI or exact item-specific authorization is legal. Patrol reports UNAUTHORIZED_THREAD_PIN or PIN_PROVENANCE_UNKNOWN and never Pins/Unpins. Do not infer Pin authority from creation, dispatch, ACTIVE, blocking, rework, verification, milestone, importance, or longevity. Patrol only observes minimum runtime faults/PENDING_WAKE/subagent evidence/Supervisor waits/duplicate Patrol/Pin provenance/terminal cleanup; it never checks engineering progress or quality, repairs, dispatches, verifies, accepts, creates/forks tasks, or creates/delegates agents. Add no D4, new technical role, general message bus, device monitor, Runtime method, universal TDD, Chain/Stage/Barrier, or graph activation. Blank records are PENDING; readiness and full simulation must PASS before dispatch. Consume the frozen LCCoding RUN_CONTRACT and do not redefine Calabash, centralized project security, delivery, or project completion."
