interface:
  display_name: "Small Loop Skill (SLK)"
  short_description: "One strict serial Run: Control + Worker, with one non-authoritative Patrol"
  default_prompt: "Use only $small-loop-skill (SLK) for one bounded strict serial Run. Formal engineering topology is one Control plus one persistent Worker; each Control decision declares SUPERVISOR_RESPONSIBILITY, CHECKER_RESPONSIBILITY, or VERIFIER_RESPONSIBILITY. Add exactly one non-authoritative RUN_PATROL using gpt-5.6-luna+xhigh. Preserve D0 Worker, D1 Checker, D2/D3 Verifier, immutable candidates, causal repair, security hard brakes, and Owner Acceptance. Supervisor may use only timeoutMs:0 snapshots: any positive wait_threads, even one-shot/outside-loop, any loop, and wait-all are forbidden. Worker alone wakes the frozen Checker through four bounded scoped GO/CELL n/N levels; matching WAKE_ACK or processing evidence stops escalation, with no ID guessing/replacement Checker/real test sleep. GO/CELL/Round/plan steps, subtask, 子任务, and visible peer tasks are not subagents; reject spawn_agent, delegate_task, hidden Agent, or background Agent evidence. Worker reports delivery; Checker derives D1 acceptance and sends one GO-candidate milestone; Supervisor derives D2/Run/Owner progress. Every D2/D3/Owner material verdict requires exactly one later Supervisor-to-Owner progress event bound by trigger event, receipt, and verdict. Required-set amendments recompute denominators without adding acceptance. Before dispatch Supervisor freezes measurable DEVICE_CAPACITY_PROFILE, CUMULATIVE_ENGINEERING_LOAD, and total-cost CELL_CAPACITY_GATE; only PASS dispatches. Worker never self-splits; on excess scope stop/checkpoint and return CELL_SCOPE_EXCEEDED. Three or more post-dispatch successors require CELL_OVERSIZE_SEVERE and remaining-plan/device-budget review. Frozen Patrol workload maps LOW→10, MEDIUM→15, HIGH→30 minutes. Every patrol_cycle_id contains exactly one each of forward-motion, PENDING_WAKE, subagent, Supervisor-wait, Patrol-uniqueness, Pin, and terminal-closure checks with enumerated results/evidence/fixed alerts. Patrol never checks engineering quality/progress, repairs, dispatches, verifies, accepts, Pins/Unpins, creates/forks tasks, or creates/delegates agents. The three Control responsibilities and Worker default to denied set_thread_pinned(true); Patrol is non-technical and denied separately. Only proven Owner manual UI or exact task authorization is legal; Patrol reports UNAUTHORIZED_THREAD_PIN/PIN_PROVENANCE_UNKNOWN without Unpinning. Every formal dispatch must appear in a versioned RUN_RUNTIME_INDEX with exactly one current capacity PASS, wake trace, Worker delivery progress, and current complete Patrol cycle; missing/extra/duplicate/stale/wrong-scope evidence fails closed. The index is evidence, not a Runtime. Add no D4, new technical role, general message bus, device monitor, Runtime method, universal TDD, Chain/Stage/Barrier, or graph activation. Blank records are PENDING; readiness and complete simulation/index must pass. Consume the frozen LCCoding RUN_CONTRACT; do not redefine Calabash, centralized security, delivery, or project completion."
