interface:
  display_name: "Small Loop Skill (SLK)"
  short_description: "One strict serial Run: Control + Worker, with one non-authoritative Patrol"
  default_prompt: "Use only $small-loop-skill (SLK) for one bounded strict serial Run. Formal topology is one Control plus one persistent Worker; Control activates exactly one of SUPERVISOR_RESPONSIBILITY, CHECKER_RESPONSIBILITY, or VERIFIER_RESPONSIBILITY, and one non-authoritative RUN_PATROL remains separate. Preserve D0-D3, immutable candidates, causal repair, Owner Acceptance, progress, capacity, wake, Pin, and security brakes. Every role action uses a current MODEL_BINDING_TRACE entry with separate role/scope identity, actual model, GPT reference capability class, capability-equivalence evidence, reasoning effort, selection level/reason, and readiness/isolation/verification PASS. Default is gpt-5.6-terra+xhigh. Only a contract-marked fine-grained/low-risk CELL Worker may use Luna; only high-difficulty correction, root-cause diagnosis, or complex rework may use gpt-5.6-sol+xhigh. Reject gpt-5.5 and lower, cost/convenience downgrade, unevidenced substitutes, unauthorized ultra, and any silent model switch. Same actual model never merges roles. Patrol defaults to Terra, has no Luna/Sol exception, and only observes the complete patrol_cycle_id checklist. Worker alone wakes the frozen Checker through four bounded GO/CELL n/N levels; matching WAKE_ACK stops escalation, with no guessed/replacement Checker or real test sleep. Supervisor uses only timeoutMs:0 snapshots: any positive wait_threads, loops, and wait-all are forbidden. Visible tasks and subtask/子任务 are not subagents; reject spawn_agent, delegate_task, hidden Agent, and background Agent evidence. Worker reports delivery, Checker derives D1 CELL acceptance, and Supervisor derives D2/Run/Owner progress from current receipts and Required sets. Before dispatch require measurable device/load facts and CELL_CAPACITY_GATE PASS; Worker never self-splits. Every formal dispatch appears in RUN_RUNTIME_INDEX with current capacity, model binding, wake, delivery, and Patrol evidence. The Control responsibilities and Worker deny set_thread_pinned(true); Patrol is denied separately and reports UNAUTHORIZED_THREAD_PIN/PIN_PROVENANCE_UNKNOWN without Unpinning. Add no D4, new technical role, model router, cost optimizer, message bus, device monitor, Runtime method, universal TDD, Chain/Stage/Barrier, or graph activation. Blank records are PENDING; readiness, simulation, and index evidence fail closed. Consume the frozen LCCoding RUN_CONTRACT; do not redefine product, centralized security, delivery, or project completion."
