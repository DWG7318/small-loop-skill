[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slk-temporal-templates"
version = "4.4.5"
description = "Temporal continuity templates for Small Loop Skill"
requires-python = ">=3.10"
dependencies = ["temporalio>=1.33,<2"]

[project.scripts]
slk-temporal-worker = "slk_temporal.worker:main"
slk-temporal-start = "slk_temporal.starter:main"
slk-temporal-admit = "slk_temporal.admitter:main"
slk-temporal-delivery = "slk_temporal.delivery_client:main"
slk-temporal-recover = "slk_temporal.recovery_client:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
