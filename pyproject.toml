[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slk-transport"
version = "4.0.0"
description = "Exact cross-agent transport for Small Loop Skill"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
slk-transport = "slk_transport.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
